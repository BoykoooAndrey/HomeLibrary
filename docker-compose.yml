services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: homelibrary-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "HomeLibrary_123!"
    ports:
      - "1433:1433"
    volumes:
      - homelibrary-mssql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HomeLibrary_123!' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mssql-init:
    image: mcr.microsoft.com/mssql-tools
    container_name: homelibrary-mssql-init
    depends_on:
      - mssql
    environment:
      MSSQL_SA_PASSWORD: "HomeLibrary_123!"
    volumes:
      - ./Database:/scripts:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homelibrary-app
    depends_on:
      mssql-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__HomeLibrary: "Server=mssql,1433;Database=HomeLibrary;User Id=sa;Password=HomeLibrary_123!;TrustServerCertificate=True;"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  homelibrary-mssql-data: